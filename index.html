<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Catatan Keuangan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <h1>💰 Catatan Keuangan</h1>
    <div class="saldo">
      Saldo Total: <span>Rp 0</span>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>

    <!-- ===== CHART ===== -->
    <section class="chart-box">
      <canvas id="financeChart"></canvas>
    </section>

    <!-- ===== MARKET INFO ===== -->
    <section class="market-info">
      <h2>📊 Market Update</h2>

      <div class="market-grid">

        <div class="card">
          <p>Bitcoin</p>
          <span id="btc" class="neutral">Loading...</span>
          <small id="btcChange"></small>
        </div>

        <div class="card">
          <p>Emas Dunia</p>
          <span id="gold" class="neutral">Loading...</span>
          <small id="goldChange"></small>
        </div>

        <div class="card">
          <p>USD → IDR</p>
          <span id="usd">Loading...</span>
        </div>

      </div>

      <div class="update-time" id="updateTime"></div>
    </section>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    © 2026 • Web Keuangan Pribadi
  </footer>

  <script src="script.js"></script>
</body>
</html>
