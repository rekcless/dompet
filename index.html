<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Wallet Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <h1>💰 Wallet Tracker</h1>
  <div class="saldo">
    Saldo: <span id="saldo">Rp 0</span>
  </div>
</header>

<main>

  <!-- INPUT -->
  <section class="card">
    <h2>Tambah Transaksi</h2>
    <select id="type">
      <option value="income">Pemasukan</option>
      <option value="expense">Pengeluaran</option>
    </select>
    <input type="number" id="amount" placeholder="Nominal">
    <input type="text" id="note" placeholder="Catatan">
    <button id="saveBtn">Simpan</button>
  </section>

  <!-- GRAFIK -->
  <section class="card">
    <h2>Grafik Keuangan</h2>
    <canvas id="chart"></canvas>
  </section>

  <!-- MARKET -->
  <section class="card">
    <h2>📊 Market Update</h2>
    <div class="market">
      <div id="btc" class="market-item">Bitcoin: loading...</div>
      <div id="gold" class="market-item">Emas Dunia: loading...</div>
      <div id="usd" class="market-item">USD → IDR: loading...</div>
    </div>
  </section>

  <!-- RIWAYAT -->
  <section class="card">
    <h2>Riwayat Transaksi</h2>
    <ul id="history"></ul>
  </section>

</main>

<footer>
  © 2026 Wallet App
</footer>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
